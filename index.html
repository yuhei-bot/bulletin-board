<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>index logic | 街と自分の居場所</title>
    <style>
        :root {
            --bg: #f5f4f0;
            --card-bg: #faf9f6;
            --text-main: #4a4944;
            --text-sub: #8c8b85;
            --text-light: #c2c1bc;
            --accent: #d4cfc3;
        }

        * { box-sizing: border-box; }
        body { 
            font-family: "Hiragino Mincho ProN", "serif"; 
            background: var(--bg); 
            color: var(--text-main); 
            margin: 0; 
            overflow: hidden; 
            line-height: 2.2; 
        }

        .layout { display: grid; grid-template-columns: 240px 1fr 300px; height: 100vh; }

        /* --- ナビゲーション --- */
        .nav-sidebar { background: #eeede8; border-right: 1px solid var(--accent); padding: 50px 30px; display: flex; flex-direction: column; overflow-y: auto; }
        .sidebar-title { font-size: 11px; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.2em; margin-bottom: 16px; margin-top: 40px; }
        .nav-item { padding: 10px 0; font-size: 13px; cursor: pointer; transition: 1s; color: var(--text-sub); border: none; background: none; text-align: left; display: block; width: 100%; text-decoration: none; }
        .nav-item:hover { color: var(--text-main); transform: translateX(3px); }
        .nav-item.active { color: var(--text-main); font-weight: 600; }

        /* --- メインエリア --- */
        .board-main { padding: 0; overflow-y: auto; display: flex; flex-direction: column; background: var(--bg); scroll-behavior: smooth; }
        .sticky-header { position: sticky; top: 0; background: rgba(245, 244, 240, 0.95); backdrop-filter: blur(8px); padding: 40px 80px; z-index: 10; display: flex; justify-content: space-between; align-items: center; gap: 20px; }
        .search-row { display: flex; gap: 20px; opacity: 0.6; transition: 0.8s; flex: 1; }
        .search-input { width: 100%; padding: 10px 0; border: none; border-bottom: 1px solid var(--accent); background: transparent; font-size: 13px; outline: none; color: var(--text-main); font-family: inherit; }

        .btn-create { border: none; background: transparent; color: var(--text-sub); font-size: 13px; cursor: pointer; padding: 10px 20px; transition: 0.5s; font-family: inherit; text-decoration: underline; text-underline-offset: 8px; white-space: nowrap; }
        .btn-create:hover { color: var(--text-main); }

        .content-body { padding: 0 80px 150px 80px; max-width: 800px; }
        .tab-row { display: flex; gap: 40px; margin-bottom: 40px; margin-top: 20px; }
        .tab-item { font-size: 13px; color: var(--text-light); cursor: pointer; transition: 0.5s; }
        .tab-item.active { color: var(--text-sub); text-decoration: underline; text-underline-offset: 8px; }

        /* 投稿モーダル */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(245, 244, 240, 0.98); z-index: 100; justify-content: center; align-items: center; }
        .post-form { width: 500px; padding: 40px; }
        .post-textarea { width: 100%; height: 200px; border: none; background: transparent; font-family: inherit; font-size: 16px; outline: none; resize: none; border-bottom: 1px solid var(--accent); margin-bottom: 40px; line-height: 2; }

        /* カード */
        .thread-card { padding: 60px 40px; background: var(--card-bg); border-radius: 4px; margin-bottom: 40px; transition: 1.2s ease; position: relative; border: 1px solid rgba(0,0,0,0.01); }
        .thread-card:hover { background: #fdfdfb; box-shadow: 0 10px 30px rgba(74, 73, 68, 0.03); }
        .card-meta { display: flex; gap: 20px; font-size: 11px; color: var(--text-light); margin-bottom: 20px; }
        .thread-title { font-weight: 500; font-size: 19px; margin-bottom: 16px; color: #3d3c38; }
        .thread-summary { font-size: 14px; color: var(--text-sub); letter-spacing: 0.04em; }

        /* 主ラベル */
        .owner-badge { position: absolute; top: 30px; right: 40px; font-size: 10px; color: var(--text-sub); border: 1px solid var(--accent); padding: 2px 10px; border-radius: 20px; letter-spacing: 0.1em; }
        
        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 40px; }
        .card-actions { display: flex; gap: 20px; }
        .action-link { font-size: 11px; color: var(--text-light); border: none; background: none; cursor: pointer; transition: 0.5s; font-family: inherit; }
        .action-link:hover { color: var(--text-sub); }

        /* ページネーション */
        .pagination { display: flex; justify-content: center; gap: 20px; margin-top: 60px; }
        .page-btn { background: none; border: none; cursor: pointer; font-size: 13px; color: var(--text-light); font-family: inherit; }
        .page-btn.active { color: var(--text-main); font-weight: 600; }

        /* 右サイドバー */
        .air-sidebar { background: #eeede8; border-left: 1px solid var(--accent); padding: 50px 40px; }
        .today-comment { font-size: 12px; color: var(--text-sub); line-height: 2.8; margin-bottom: 60px; }
        .air-card { font-size: 11px; color: var(--text-sub); margin-bottom: 25px; display: flex; align-items: center; gap: 10px; opacity: 0.7; }
        .pulse { width: 3px; height: 3px; background: #c2c1bc; border-radius: 50%; box-shadow: 0 0 6px #c2c1bc; }
    </style>
</head>
<body>

<div id="post-modal" class="modal">
    <div class="post-form">
        <div style="font-size: 12px; color: var(--text-light); margin-bottom: 40px;">今の気持ちを置いていきます</div>
        <input type="text" id="new-title" class="search-input" placeholder="タイトル（明け方の窓際...）" style="margin-bottom: 30px; border-bottom-color: var(--accent);">
        <textarea id="new-content" class="post-textarea" placeholder="静かに書き残す..."></textarea>
        <div style="display: flex; gap: 40px;">
            <button class="btn-create" onclick="closePostModal()">やめる</button>
            <button class="btn-create" style="font-weight: 600;" onclick="submitPost()">置いていく</button>
        </div>
    </div>
</div>

<div class="layout">
    <nav class="nav-sidebar">
        <h2 style="font-size: 13px; font-weight: 400; color: var(--text-sub); margin-bottom: 50px; letter-spacing: 0.3em;">index logic</h2>
        <div class="nav-item active" id="nav-home" onclick="resetAndShowHome()">街の風景</div>
        <div class="nav-item" id="nav-profile" onclick="showView('profile')">最近いた場所</div>

        <h2 class="sidebar-title">自分の痕跡</h2>
        <div id="my-trace-list">
            <div class="nav-item" style="font-size: 11px; opacity: 0.6;">まだ何も置いていません</div>
        </div>

        <h2 class="sidebar-title">趣味の空気</h2>
        <div id="category-hobby"></div>

        <h2 class="sidebar-title">ココロの気配</h2>
        <div id="category-counsel"></div>
    </nav>

    <main class="board-main" id="main-scroll">
        <header class="sticky-header">
            <div class="search-row">
                <input type="text" class="search-input" id="search-bar" placeholder="眠れない夜に…" onkeyup="handleSearch()">
                <input type="text" class="search-input" style="width: 150px;" id="area-bar" placeholder="静かな場所…" onkeyup="handleSearch()">
            </div>
            <button class="btn-create" onclick="openPostModal()">言葉を置いていく</button>
        </header>

        <div class="content-body">
            <section id="board-view">
                <div class="tab-row">
                    <div class="tab-item active" id="tab-new" onclick="switchSort('new')">新しい気配</div>
                    <div class="tab-item" id="tab-popular" onclick="switchSort('popular')">人のあかり</div>
                </div>
                <div id="thread-list"></div>
                <div id="pagination" class="pagination"></div>
            </section>

            <section id="profile-view" style="display:none; padding-top: 40px;">
                <h2 style="font-size: 18px; font-weight: 500;">最近いた場所</h2>
                <div class="tab-row">
                    <div class="tab-item active" id="tab-my-threads" onclick="switchProfileTab('my')">立てた言葉</div>
                    <div class="tab-item" id="tab-history" onclick="switchProfileTab('history')">観覧の履歴</div>
                    <div class="tab-item" id="tab-favorites" onclick="switchProfileTab('fav')">そばに置いた</div>
                </div>
                <div id="profile-content-list"></div>
            </section>
        </div>
    </main>

    <aside class="air-sidebar">
        <div class="today-comment" id="today-msg">
            少し日が落ちてきました。<br>
            街には、家々の窓から<br>
            小さな灯りが漏れ始めています。
        </div>
        <div id="air-stats"></div>
    </aside>
</div>

<script>
    const hobbyCats = [
        {id: 'reading', name: '深夜読書', icon: '🌙'},
        {id: 'tech', name: '無言作業', icon: '💻'},
        {id: 'game', name: 'ボートレース', icon: '🚤'},
        {id: 'travel', name: 'いつかの旅', icon: '✈️'}
    ];

    const counselCats = [
        {id: 'human', name: '人間関係', icon: '👥'},
        {id: 'health', name: 'ココロ', icon: '🌿'},
        {id: 'money', name: 'お金のこと', icon: '🪙'}
    ];

    const allCategories = [...hobbyCats, ...counselCats];
    const titles = ["明け方の窓際", "雨の音を聞く", "言葉にならないこと", "静かな時間の断片", "誰かがいた気配"];
    
    let allThreads = [];
    let currentFilteredThreads = [];
    let currentSort = 'new';
    let currentCategory = 'all';
    let currentPage = 1;
    let favorites = [];
    let myPosts = [];
    let history = [];
    let currentProfileTab = 'my';
    const itemsPerPage = 5; 

    function generateData() {
        for (let i = 1; i <= 20; i++) {
            const cat = allCategories[i % allCategories.length];
            allThreads.push({
                id: i, category: cat.id, name: cat.name,
                title: titles[i % titles.length],
                summary: `特別なことは何もありませんが、今の${cat.name}の気配を置いておきます。`,
                area: 'どこか', stars: Math.floor(Math.random() * 50),
                createdAt: new Date(Date.now() - i * 3600000),
                isOwner: false
            });
        }
        applyFilterAndSort();
    }

    function applyFilterAndSort() {
        let result = [...allThreads];
        if (currentCategory !== 'all') result = result.filter(t => t.category === currentCategory);
        
        const q = document.getElementById('search-bar').value.toLowerCase();
        const aq = document.getElementById('area-bar').value.toLowerCase();
        if (q) result = result.filter(t => t.title.includes(q) || t.summary.includes(q));
        if (aq) result = result.filter(t => t.area.toLowerCase().includes(aq));

        result.sort((a, b) => currentSort === 'new' ? b.createdAt - a.createdAt : b.stars - a.stars);
        currentFilteredThreads = result;
        renderThreads();
    }

    function renderThreads() {
        const list = document.getElementById('thread-list');
        const start = (currentPage - 1) * itemsPerPage;
        const pageItems = currentFilteredThreads.slice(start, start + itemsPerPage);

        list.innerHTML = pageItems.map(t => createCardHtml(t)).join('');
        renderPagination(currentFilteredThreads.length);
        renderMyTraceSidebar();
    }

    // スレッドカードのHTML生成（主マーク対応）
    function createCardHtml(t) {
        return `
            <article class="thread-card">
                ${t.isOwner ? '<div class="owner-badge">主</div>' : ''}
                <div class="card-meta"><span>📍 ${t.area}</span><span>${t.name || '日常'}</span></div>
                <div class="thread-title">${t.title}</div>
                <p class="thread-summary">${t.summary}</p>
                <div class="card-footer">
                    <div class="card-actions">
                        <button class="action-link" onclick="addFavorite(${t.id})">そばに置く</button>
                        <button class="action-link" onclick="reportPost(${t.id})">場所を整える</button>
                    </div>
                    <button class="btn-create" style="font-size:11px; text-decoration:none; border:1px solid var(--accent); border-radius:2px;" onclick="addToHistory(${t.id}, this)">少し座る</button>
                </div>
            </article>
        `;
    }

    function openPostModal() { document.getElementById('post-modal').style.display = 'flex'; }
    function closePostModal() { document.getElementById('post-modal').style.display = 'none'; }

    function submitPost() {
        const title = document.getElementById('new-title').value;
        const content = document.getElementById('new-content').value;
        if (!title || !content) return;

        const newPost = { 
            id: Date.now(), title, summary: content, 
            stars: 0, createdAt: new Date(), area: 'ここ', name: '自分の言葉',
            isOwner: true 
        };
        allThreads.unshift(newPost);
        myPosts.unshift(newPost);
        
        closePostModal();
        applyFilterAndSort();
        
        document.getElementById('new-title').value = '';
        document.getElementById('new-content').value = '';
    }

    // 履歴追加
    function addToHistory(id, btn) {
        const post = allThreads.find(t => t.id === id);
        if (!history.find(h => h.id === id)) {
            history.unshift(post);
        }
        btn.innerText = '座っています...';
    }

    function addFavorite(id) {
        const post = allThreads.find(t => t.id === id);
        if (!favorites.find(f => f.id === id)) {
            favorites.push(post);
            alert("そばに置きました");
        }
    }

    function reportPost(id) {
        if (confirm("この場所を整えますか？（不適切な内容として報告します）")) {
            alert("ありがとうございます。静かに確認します。");
        }
    }

    // サイドバーの簡易リスト
    function renderMyTraceSidebar() {
        const traceList = document.getElementById('my-trace-list');
        if (myPosts.length === 0) return;
        traceList.innerHTML = myPosts.slice(0, 5).map(p => `
            <div class="nav-item" style="font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">・${p.title}</div>
        `).join('');
    }

    // マイページ内タブ切り替え
    function switchProfileTab(tab) {
        currentProfileTab = tab;
        document.getElementById('tab-my-threads').classList.toggle('active', tab === 'my');
        document.getElementById('tab-history').classList.toggle('active', tab === 'history');
        document.getElementById('tab-favorites').classList.toggle('active', tab === 'fav');
        renderProfileContent();
    }

    function renderProfileContent() {
        const container = document.getElementById('profile-content-list');
        let targetList = [];
        let emptyMsg = "";

        if (currentProfileTab === 'my') {
            targetList = myPosts;
            emptyMsg = "まだ言葉を置いていません。";
        } else if (currentProfileTab === 'history') {
            targetList = history;
            emptyMsg = "まだどこにも座っていません。";
        } else {
            targetList = favorites;
            emptyMsg = "まだ何もそばに置いていません。";
        }

        if (targetList.length === 0) {
            container.innerHTML = `<p style="color:var(--text-light); font-size:13px; padding-top:20px;">${emptyMsg}</p>`;
            return;
        }

        container.innerHTML = targetList.map(t => createCardHtml(t)).join('');
    }

    function renderPagination(total) {
        const pages = Math.ceil(total / itemsPerPage);
        let html = '';
        for (let i = 1; i <= pages; i++) {
            html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
        }
        document.getElementById('pagination').innerHTML = html;
    }

    function changePage(p) {
        currentPage = p;
        renderThreads();
        document.getElementById('main-scroll').scrollTo({ top: 0, behavior: 'smooth' });
    }

    function switchSort(type) {
        currentSort = type;
        document.getElementById('tab-new').classList.toggle('active', type === 'new');
        document.getElementById('tab-popular').classList.toggle('active', type === 'popular');
        currentPage = 1;
        applyFilterAndSort();
    }

    function filterCategory(id) {
        currentCategory = id;
        showView('home');
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        event.currentTarget.classList.add('active');
        currentPage = 1;
        applyFilterAndSort();
    }

    function resetAndShowHome() {
        currentCategory = 'all';
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        document.getElementById('nav-home').classList.add('active');
        showView('home');
        currentPage = 1;
        applyFilterAndSort();
    }

    function showView(v) {
        document.getElementById('board-view').style.display = v === 'home' ? 'block' : 'none';
        document.getElementById('profile-view').style.display = v === 'profile' ? 'block' : 'none';
        
        // サイドバーのアクティブ切り替え
        document.getElementById('nav-home').classList.toggle('active', v === 'home');
        document.getElementById('nav-profile').classList.toggle('active', v === 'profile');

        if(v === 'profile') renderProfileContent();
    }

    function handleSearch() { currentPage = 1; applyFilterAndSort(); }

    document.addEventListener('DOMContentLoaded', () => {
        generateData();
        document.getElementById('category-hobby').innerHTML = hobbyCats.map(c => `<button class="nav-item" onclick="filterCategory('${c.id}')">${c.name}</button>`).join('');
        document.getElementById('category-counsel').innerHTML = counselCats.map(c => `<button class="nav-item" onclick="filterCategory('${c.id}')">${c.name}</button>`).join('');
        document.getElementById('air-stats').innerHTML = hobbyCats.slice(0,3).map(c => `<div class="air-card"><div class="pulse"></div>${c.name}に気配があります</div>`).join('');
    });
</script>

</body>
</html>
